name: trading-bot

on:
  schedule:
    - cron: "*/10 3-10 * * 1-5"   # every 10 min during Indian market hours (UTC)
    - cron: "17 */3 * * *"        # every 3 hours, to answer Telegram commands
  workflow_dispatch:              # "Run workflow" button

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - name: Run bot once
        run: node src/bot.js
        env:
          ONCE: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASH_USER: ${{ secrets.DASH_USER }}
          DASH_PASS: ${{ secrets.DASH_PASS }}
          DASH_PIN: ${{ secrets.DASH_PIN }}
      - name: Upload web page
        if: ${{ hashFiles('site/index.html') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish to GitHub Pages
        id: deploy
        if: ${{ hashFiles('site/index.html') != '' }}
        uses: actions/deploy-pages@v4
